name: Performance Budget

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/performance.yml'
  workflow_dispatch:

jobs:
  bundle-budget:
    name: Initial JavaScript budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Fails when initial JS gzip exceeds 200,000 bytes or deferred modules
      # (Leaflet, address reference data) enter the initial graph.
      - name: Check bundle budget
        run: node frontend/scripts/measure-bundle.mjs
