<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1280" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="adminHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="configGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="auditGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="analyticsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <!-- Shadows & Glows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="adminGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.5" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowAdmin" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1280" fill="#0b0f19" />
  
  <!-- Subtle Grid Lines -->
  <pattern id="gridAdmin" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
  </pattern>
  <rect width="1000" height="1280" fill="url(#gridAdmin)" />

  <!-- HEADER -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="900" height="85" rx="16" fill="url(#stepGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="10" height="85" rx="4" fill="url(#adminHeaderGrad)" />
    
    <text x="35" y="38" fill="#f8fafc" font-size="22" font-weight="bold" letter-spacing="0.5">MEGS RECRUITMENT PLATFORM</text>
    <text x="35" y="62" fill="#fbbf24" font-size="15" font-weight="600">ADMINISTRATOR WORKFLOW</text>
    
    <rect x="720" y="25" width="150" height="34" rx="8" fill="#78350f" fill-opacity="0.4" stroke="#fbbf24" stroke-width="1"/>
    <text x="795" y="47" fill="#fef3c7" font-size="13" font-weight="600" text-anchor="middle">ROLE: ADMIN</text>
  </g>

  <!-- FLOWCHART NODES -->

  <!-- STEP 1: Users & Access -->
  <g transform="translate(290, 155)">
    <rect x="0" y="0" width="420" height="75" rx="12" fill="url(#stepGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="35" cy="37" r="18" fill="#d97706" />
    <text x="35" y="43" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">1</text>
    <text x="70" y="32" fill="#f1f5f9" font-size="15" font-weight="bold">User &amp; Access Control</text>
    <text x="70" y="52" fill="#94a3b8" font-size="12">Manage staff accounts, roles &amp; permissions</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 500 230 L 500 265" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAdmin)" />

  <!-- STEP 2: AI & Scoring Setup -->
  <g transform="translate(290, 265)">
    <rect x="0" y="0" width="420" height="75" rx="12" fill="url(#configGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="35" cy="37" r="18" fill="#b45309" />
    <text x="35" y="43" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">2</text>
    <text x="70" y="32" fill="#fef3c7" font-size="15" font-weight="bold">AI &amp; Scoring Settings</text>
    <text x="70" y="52" fill="#fde68a" font-size="12">Configure score weights &amp; feature toggles</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 500 340 L 500 375" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAdmin)" />

  <!-- STEP 3: Clients & MRFs -->
  <g transform="translate(290, 375)">
    <rect x="0" y="0" width="420" height="75" rx="12" fill="url(#stepGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="35" cy="37" r="18" fill="#d97706" />
    <text x="35" y="43" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">3</text>
    <text x="70" y="32" fill="#f1f5f9" font-size="15" font-weight="bold">Clients &amp; MRF Approvals</text>
    <text x="70" y="52" fill="#94a3b8" font-size="12">Register client companies &amp; approve job requests</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 500 450 L 500 485" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAdmin)" />

  <!-- STEP 4: Compliance Rules & Master Data -->
  <g transform="translate(290, 485)">
    <rect x="0" y="0" width="420" height="75" rx="12" fill="url(#stepGrad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="35" cy="37" r="18" fill="#d97706" />
    <text x="35" y="43" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">4</text>
    <text x="70" y="32" fill="#f1f5f9" font-size="15" font-weight="bold">Compliance &amp; Master Data</text>
    <text x="70" y="52" fill="#94a3b8" font-size="12">Set required documents &amp; skills list</text>
  </g>

  <!-- Arrow 4 -> 5 Split -->
  <path d="M 500 560 L 500 600" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAdmin)" />

  <!-- MONITORING & INSIGHTS (Side by Side) -->
  <g transform="translate(130, 600)">
    <!-- Box Left: Audit Logs -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="350" height="85" rx="12" fill="url(#auditGrad)" stroke="#818cf8" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="35" cy="42" r="16" fill="#4f46e5" />
      <text x="35" y="47" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">5</text>
      <text x="65" y="33" fill="#e0e7ff" font-size="15" font-weight="bold">Audit &amp; Security Logs</text>
      <text x="65" y="55" fill="#c7d2fe" font-size="12">Track user actions &amp; system events</text>
    </g>

    <!-- Box Right: Analytics -->
    <g transform="translate(390, 0)">
      <rect x="0" y="0" width="350" height="85" rx="12" fill="url(#analyticsGrad)" stroke="#34d399" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="35" cy="42" r="16" fill="#059669" />
      <text x="35" y="47" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">6</text>
      <text x="65" y="33" fill="#ecfdf5" font-size="15" font-weight="bold">Analytics &amp; KPIs</text>
      <text x="65" y="55" fill="#a7f3d0" font-size="12">Hiring speed, funnel stats &amp; TA performance</text>
    </g>
  </g>

  <!-- Convergence to Step 7 -->
  <path d="M 305 685 L 305 725 L 500 725" stroke="#fbbf24" stroke-width="1.5" />
  <path d="M 695 685 L 695 725 L 500 725" stroke="#fbbf24" stroke-width="1.5" />
  <path d="M 500 725 L 500 755" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAdmin)" />

  <!-- STEP 7: Reports & System Review -->
  <g transform="translate(270, 755)">
    <rect x="0" y="0" width="460" height="85" rx="14" fill="url(#stepGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#adminGlow)"/>
    <circle cx="45" cy="42" r="20" fill="#d97706" />
    <text x="45" y="48" fill="#ffffff" font-size="16" text-anchor="middle">📊</text>
    <text x="80" y="35" fill="#fef3c7" font-size="16" font-weight="bold">Reports &amp; Oversight</text>
    <text x="80" y="57" fill="#cbd5e1" font-size="12">Export summary reports &amp; adjust platform policies</text>
  </g>

  <!-- FOOTER -->
  <text x="500" y="1230" fill="#475569" font-size="12" text-anchor="middle">MEGS Recruitment Management System • Flowchart 3 of 3: Administrator Workflow</text>
</svg>
