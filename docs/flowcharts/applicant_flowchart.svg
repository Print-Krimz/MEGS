<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="appHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="decisionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    
    <!-- Glow and Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowSuccess" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrowAlt" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="1320" fill="#0b0f19" />
  
  <!-- Subtle Grid Lines -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
  </pattern>
  <rect width="1000" height="1320" fill="url(#grid)" />

  <!-- HEADER -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="900" height="90" rx="16" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="0" y="0" width="10" height="90" rx="4" fill="url(#appHeaderGrad)" />
    
    <text x="35" y="42" fill="#f8fafc" font-size="24" font-weight="bold" letter-spacing="0.5">MEGS RECRUITMENT PLATFORM</text>
    <text x="35" y="68" fill="#38bdf8" font-size="16" font-weight="600">APPLICANT USER JOURNEY &amp; FLOWCHART</text>
    
    <rect x="740" y="28" width="130" height="34" rx="8" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <text x="805" y="50" fill="#bae6fd" font-size="13" font-weight="600" text-anchor="middle">ROLE: APPLICANT</text>
  </g>

  <!-- FLOWCHART STEPS -->

  <!-- STEP 1: Registration & Auth -->
  <g transform="translate(300, 160)">
    <rect x="0" y="0" width="400" height="75" rx="12" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="35" cy="37" r="18" fill="#0284c7" />
    <text x="35" y="43" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">1</text>
    <text x="70" y="32" fill="#f1f5f9" font-size="15" font-weight="bold">Account Registration &amp; Sign In</text>
    <text x="70" y="54" fill="#94a3b8" font-size="12">Supabase Auth • Email Verification • Role: APPLICANT</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 500 235 L 500 270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 2: Profile Completion -->
  <g transform="translate(300, 270)">
    <rect x="0" y="0" width="400" height="85" rx="12" fill="url(#stepGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="35" cy="42" r="18" fill="#0284c7" />
    <text x="35" y="48" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">2</text>
    <text x="70" y="32" fill="#f1f5f9" font-size="15" font-weight="bold">Build Applicant Profile &amp; Resume</text>
    <text x="70" y="52" fill="#94a3b8" font-size="12">Personal Details • Education • Work Experience</text>
    <text x="70" y="70" fill="#94a3b8" font-size="12">Skills Inventory • Upload PDF Resume to Supabase</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 500 355 L 500 390" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 3: Job Discovery & Search -->
  <g transform="translate(300, 390)">
    <rect x="0" y="0" width="400" height="75" rx="12" fill="url(#stepGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="35" cy="37" r="18" fill="#0284c7" />
    <text x="35" y="43" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">3</text>
    <text x="70" y="32" fill="#f1f5f9" font-size="15" font-weight="bold">Explore Job Postings</text>
    <text x="70" y="54" fill="#94a3b8" font-size="12">Filter by Location, Industry, &amp; Skills • View Specs</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 500 465 L 500 500" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 4: Application Submission -->
  <g transform="translate(300, 500)">
    <rect x="0" y="0" width="400" height="75" rx="12" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="35" cy="37" r="18" fill="#0284c7" />
    <text x="35" y="43" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">4</text>
    <text x="70" y="32" fill="#f1f5f9" font-size="15" font-weight="bold">Submit Job Application</text>
    <text x="70" y="54" fill="#94a3b8" font-size="12">Attach Resume • Status: <tspan fill="#38bdf8" font-weight="bold">SUBMITTED</tspan></text>
  </g>

  <!-- Arrow 4 -> 5 (AI System) -->
  <path d="M 500 575 L 500 610" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 5: AI Parsing & Scoring (Automated Background Phase) -->
  <g transform="translate(260, 610)">
    <rect x="0" y="0" width="480" height="85" rx="14" fill="url(#aiGrad)" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#cardShadow)"/>
    <rect x="16" y="14" width="36" height="36" rx="8" fill="#4f46e5" />
    <text x="34" y="38" fill="#ffffff" font-size="16" text-anchor="middle">⚡</text>
    <text x="66" y="35" fill="#e0e7ff" font-size="15" font-weight="bold">System: Automated AI Extraction &amp; Matching</text>
    <text x="66" y="55" fill="#c7d2fe" font-size="12">Gemini Resume Parsing • Status: <tspan font-weight="bold" fill="#a5b4fc">PARSING</tspan> ➔ <tspan font-weight="bold" fill="#a5b4fc">REVIEW</tspan></text>
    <text x="66" y="72" fill="#94a3b8" font-size="11">Extracts Experience, Skills &amp; Generates Vector Embeddings</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 500 695 L 500 730" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 6: Decision / Screening Outcome -->
  <g transform="translate(320, 730)">
    <polygon points="180,0 360,55 180,110 0,55" fill="url(#decisionGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="180" y="48" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">TA Initial Screening &amp;</text>
    <text x="180" y="68" fill="#e9d5ff" font-size="13" font-weight="bold" text-anchor="middle">Score Evaluation</text>
  </g>

  <!-- Branch Left: Talent Pool -->
  <path d="M 320 785 L 140 785 L 140 850" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowAlt)" />
  <rect x="155" y="765" width="130" height="20" rx="4" fill="#1e293b" />
  <text x="220" y="779" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle">Not Matched Now</text>

  <g transform="translate(40, 850)">
    <rect x="0" y="0" width="200" height="85" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <text x="100" y="28" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Talent Pool / Future</text>
    <text x="100" y="48" fill="#94a3b8" font-size="11" text-anchor="middle">Status: <tspan fill="#f59e0b" font-weight="bold">TALENT_POOL</tspan></text>
    <text x="100" y="68" fill="#64748b" font-size="11" text-anchor="middle">Indexed for KNN Matching</text>
  </g>

  <!-- Branch Down: Shortlisted / Interviews -->
  <path d="M 500 840 L 500 875" stroke="#10b981" stroke-width="2" marker-end="url(#arrowSuccess)" />
  <rect x="510" y="845" width="105" height="20" rx="4" fill="#064e3b" />
  <text x="562" y="859" fill="#6ee7b7" font-size="11" font-weight="bold" text-anchor="middle">Passed Screen</text>

  <!-- STEP 7: Interviews (Screening & Final) -->
  <g transform="translate(300, 875)">
    <rect x="0" y="0" width="400" height="85" rx="12" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="35" cy="42" r="18" fill="#0284c7" />
    <text x="35" y="48" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">5</text>
    <text x="70" y="30" fill="#f1f5f9" font-size="15" font-weight="bold">Interviews &amp; Client Endorsement</text>
    <text x="70" y="52" fill="#94a3b8" font-size="12">• Initial TA Interview (<tspan fill="#38bdf8">INITIAL_SCREENING</tspan>)</text>
    <text x="70" y="70" fill="#94a3b8" font-size="12">• Client Evaluation &amp; <tspan fill="#38bdf8">FINAL_INTERVIEW</tspan></text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <path d="M 500 960 L 500 995" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- STEP 8: Compliance & Pre-employment -->
  <g transform="translate(300, 995)">
    <rect x="0" y="0" width="400" height="85" rx="12" fill="url(#stepGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="35" cy="42" r="18" fill="#0284c7" />
    <text x="35" y="48" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">6</text>
    <text x="70" y="30" fill="#f1f5f9" font-size="15" font-weight="bold">Pre-Employment Compliance</text>
    <text x="70" y="52" fill="#94a3b8" font-size="12">Upload IDs: SSS, PhilHealth, Pag-IBIG, TIN</text>
    <text x="70" y="70" fill="#94a3b8" font-size="12">Submit NBI Clearance &amp; Medical (<tspan fill="#38bdf8">COMPLIANCE</tspan>)</text>
  </g>

  <!-- Arrow 8 -> 9 -->
  <path d="M 500 1080 L 500 1115" stroke="#10b981" stroke-width="2" marker-end="url(#arrowSuccess)" />

  <!-- STEP 9: Hired & Deployed -->
  <g transform="translate(280, 1115)">
    <rect x="0" y="0" width="440" height="95" rx="14" fill="url(#successGrad)" stroke="#34d399" stroke-width="2" filter="url(#accentGlow)"/>
    <circle cx="45" cy="47" r="22" fill="#059669" />
    <text x="45" y="54" fill="#ffffff" font-size="20" text-anchor="middle">✓</text>
    <text x="85" y="36" fill="#ecfdf5" font-size="17" font-weight="bold">Hired &amp; Client Deployment</text>
    <text x="85" y="58" fill="#a7f3d0" font-size="13">Status: <tspan font-weight="bold" fill="#ffffff">HIRED</tspan> ➔ <tspan font-weight="bold" fill="#ffffff">DEPLOYED</tspan></text>
    <text x="85" y="78" fill="#d1fae5" font-size="12">Employee Record Created • Project Assignment Active</text>
  </g>

  <!-- FOOTER -->
  <text x="500" y="1275" fill="#475569" font-size="12" text-anchor="middle">MEGS Recruitment Management System • Flowchart 1 of 3: Applicant Workflow</text>
</svg>
