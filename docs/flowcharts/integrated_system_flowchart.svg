<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1300" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mainHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cardDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="aiPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Filters -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c084fc" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24" />
    </marker>
    <marker id="arrowCross" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <pattern id="gridFull" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.5"/>
  </pattern>
  <rect width="1400" height="1300" fill="url(#gridFull)" />

  <!-- HEADER -->
  <g transform="translate(50, 30)">
    <rect x="0" y="0" width="1300" height="85" rx="14" fill="url(#cardDarkGrad)" stroke="#334155" stroke-width="1.5" filter="url(#boxShadow)" />
    <rect x="0" y="0" width="10" height="85" rx="3" fill="url(#mainHeaderGrad)" />
    <text x="35" y="38" fill="#f8fafc" font-size="24" font-weight="bold">MEGS RECRUITMENT &amp; TALENT ACQUISITION PLATFORM</text>
    <text x="35" y="64" fill="#94a3b8" font-size="14">Cross-Functional Swimlane: <tspan fill="#38bdf8" font-weight="bold">Applicant</tspan> | <tspan fill="#c084fc" font-weight="bold">Talent Acquisition</tspan> | <tspan fill="#fbbf24" font-weight="bold">Admin</tspan></text>
  </g>

  <!-- 3 SWIMLANE COLUMNS -->
  <!-- Column 1: APPLICANT -->
  <g transform="translate(50, 135)">
    <rect x="0" y="0" width="410" height="1100" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="50" rx="12" fill="#0369a1" fill-opacity="0.4" />
    <text x="205" y="32" fill="#bae6fd" font-size="16" font-weight="bold" text-anchor="middle">👤 APPLICANT</text>

    <!-- Step A1 -->
    <rect x="25" y="70" width="360" height="65" rx="8" fill="url(#cardDarkGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="45" y="96" fill="#f1f5f9" font-size="14" font-weight="bold">1. Sign Up &amp; Login</text>
    <text x="45" y="118" fill="#94a3b8" font-size="11">Supabase Auth • Verify Email</text>

    <!-- Arrow A1 -> A2 -->
    <path d="M 205 135 L 205 160" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <!-- Step A2 -->
    <rect x="25" y="160" width="360" height="75" rx="8" fill="url(#cardDarkGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="45" y="186" fill="#f1f5f9" font-size="14" font-weight="bold">2. Complete Profile</text>
    <text x="45" y="206" fill="#94a3b8" font-size="11">Education, experience, skills</text>
    <text x="45" y="222" fill="#94a3b8" font-size="11">Upload PDF resume</text>

    <!-- Arrow A2 -> A3 -->
    <path d="M 205 235 L 205 260" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <!-- Step A3 -->
    <rect x="25" y="260" width="360" height="65" rx="8" fill="url(#cardDarkGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="45" y="286" fill="#f1f5f9" font-size="14" font-weight="bold">3. Browse Jobs &amp; Apply</text>
    <text x="45" y="308" fill="#94a3b8" font-size="11">Submit Application (SUBMITTED)</text>

    <!-- Arrow A3 -> A4 -->
    <path d="M 205 325 L 205 350" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <!-- Step A4 (AI) -->
    <rect x="25" y="350" width="360" height="85" rx="10" fill="url(#aiPillGrad)" stroke="#818cf8" stroke-width="1.5" />
    <text x="45" y="375" fill="#e0e7ff" font-size="13" font-weight="bold">⚡ AI Parsing &amp; Scoring</text>
    <text x="45" y="396" fill="#c7d2fe" font-size="11">Gemini extracts data • PARSING ➔ REVIEW</text>
    <text x="45" y="414" fill="#a5b4fc" font-size="11">Calculates match score &amp; vectors</text>

    <!-- Arrow A4 -> A5 -->
    <path d="M 205 435 L 205 520" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <!-- Step A5 -->
    <rect x="25" y="520" width="360" height="75" rx="8" fill="url(#cardDarkGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="45" y="546" fill="#f1f5f9" font-size="14" font-weight="bold">4. Initial Screening</text>
    <text x="45" y="568" fill="#94a3b8" font-size="11">Interview with TA (INITIAL_SCREENING)</text>

    <!-- Arrow A5 -> A6 -->
    <path d="M 205 595 L 205 675" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <!-- Step A6 -->
    <rect x="25" y="675" width="360" height="75" rx="8" fill="url(#cardDarkGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="45" y="701" fill="#f1f5f9" font-size="14" font-weight="bold">5. Client Interview</text>
    <text x="45" y="723" fill="#94a3b8" font-size="11">Final round (FINAL_INTERVIEW)</text>

    <!-- Arrow A6 -> A7 -->
    <path d="M 205 750 L 205 830" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <!-- Step A7 -->
    <rect x="25" y="830" width="360" height="85" rx="8" fill="url(#cardDarkGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="45" y="856" fill="#f1f5f9" font-size="14" font-weight="bold">6. Upload Compliance Docs</text>
    <text x="45" y="878" fill="#94a3b8" font-size="11">Govt IDs, NBI &amp; Medical</text>
    <text x="45" y="896" fill="#94a3b8" font-size="11">Status: COMPLIANCE</text>

    <!-- Arrow A7 -> A8 -->
    <path d="M 205 915 L 205 985" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowBlue)" />

    <!-- Step A8 -->
    <rect x="25" y="985" width="360" height="85" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="45" y="1015" fill="#ecfdf5" font-size="15" font-weight="bold">7. Hired &amp; Deployed</text>
    <text x="45" y="1038" fill="#a7f3d0" font-size="12">Status: HIRED ➔ DEPLOYED</text>
    <text x="45" y="1056" fill="#6ee7b7" font-size="11">Active client assignment</text>
  </g>

  <!-- Column 2: TALENT ACQUISITION (TA) -->
  <g transform="translate(495, 135)">
    <rect x="0" y="0" width="410" height="1100" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#9333ea" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="50" rx="12" fill="#6b21a8" fill-opacity="0.4" />
    <text x="205" y="32" fill="#e9d5ff" font-size="16" font-weight="bold" text-anchor="middle">🎯 TALENT ACQUISITION (TA)</text>

    <!-- Step TA1 -->
    <rect x="25" y="70" width="360" height="75" rx="8" fill="url(#cardDarkGrad)" stroke="#c084fc" stroke-width="1.2" />
    <text x="45" y="96" fill="#f1f5f9" font-size="14" font-weight="bold">1. Post Job Openings</text>
    <text x="45" y="118" fill="#94a3b8" font-size="11">Create job from approved MRF</text>

    <!-- Arrow TA1 -> TA2 -->
    <path d="M 205 145 L 205 210" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrowPurple)" />

    <!-- Step TA2 -->
    <rect x="25" y="210" width="360" height="85" rx="8" fill="url(#cardDarkGrad)" stroke="#c084fc" stroke-width="1.2" />
    <text x="45" y="236" fill="#f1f5f9" font-size="14" font-weight="bold">2. Sourcing &amp; Talent Pool</text>
    <text x="45" y="258" fill="#94a3b8" font-size="11">KNN vector match in talent pool</text>
    <text x="45" y="276" fill="#94a3b8" font-size="11">Review inbound applicants</text>

    <!-- Arrow TA2 -> TA3 -->
    <path d="M 205 295 L 205 350" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrowPurple)" />

    <!-- Step TA3 -->
    <rect x="25" y="350" width="360" height="85" rx="8" fill="url(#cardDarkGrad)" stroke="#c084fc" stroke-width="1.2" />
    <text x="45" y="376" fill="#f1f5f9" font-size="14" font-weight="bold">3. Review AI Scores</text>
    <text x="45" y="398" fill="#94a3b8" font-size="11">Inspect skills, experience &amp; fit</text>
    <text x="45" y="416" fill="#94a3b8" font-size="11">Tag: MATCHED or TALENT_POOL</text>

    <!-- Arrow TA3 -> TA4 -->
    <path d="M 205 435 L 205 520" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrowPurple)" />

    <!-- Step TA4 -->
    <rect x="25" y="520" width="360" height="80" rx="8" fill="url(#cardDarkGrad)" stroke="#c084fc" stroke-width="1.2" />
    <text x="45" y="546" fill="#f1f5f9" font-size="14" font-weight="bold">4. Conduct Screening</text>
    <text x="45" y="568" fill="#94a3b8" font-size="11">Initial interview &amp; recruiter notes</text>
    <text x="45" y="586" fill="#94a3b8" font-size="11">Decision: Pass ➔ Endorse</text>

    <!-- Arrow TA4 -> TA5 -->
    <path d="M 205 600 L 205 675" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrowPurple)" />

    <!-- Step TA5 -->
    <rect x="25" y="675" width="360" height="75" rx="8" fill="url(#cardDarkGrad)" stroke="#c084fc" stroke-width="1.2" />
    <text x="45" y="701" fill="#f1f5f9" font-size="14" font-weight="bold">5. Client Endorsement</text>
    <text x="45" y="723" fill="#94a3b8" font-size="11">Submit candidate to client</text>

    <!-- Arrow TA5 -> TA6 -->
    <path d="M 205 750 L 205 830" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrowPurple)" />

    <!-- Step TA6 -->
    <rect x="25" y="830" width="360" height="85" rx="8" fill="url(#cardDarkGrad)" stroke="#c084fc" stroke-width="1.2" />
    <text x="45" y="856" fill="#f1f5f9" font-size="14" font-weight="bold">6. Verify Compliance</text>
    <text x="45" y="878" fill="#94a3b8" font-size="11">Review Govt IDs &amp; medical clearances</text>
    <text x="45" y="896" fill="#94a3b8" font-size="11">Mark: Verified / Rejected</text>

    <!-- Arrow TA6 -> TA7 -->
    <path d="M 205 915 L 205 985" stroke="#c084fc" stroke-width="1.5" marker-end="url(#arrowPurple)" />

    <!-- Step TA7 -->
    <rect x="25" y="985" width="360" height="85" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="45" y="1015" fill="#ecfdf5" font-size="15" font-weight="bold">7. Create Deployment</text>
    <text x="45" y="1038" fill="#a7f3d0" font-size="12">Set client project, date &amp; rates</text>
    <text x="45" y="1056" fill="#6ee7b7" font-size="11">Activate employee</text>
  </g>

  <!-- Column 3: ADMINISTRATOR (Simplified & Clean) -->
  <g transform="translate(940, 135)">
    <rect x="0" y="0" width="410" height="1100" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#d97706" stroke-width="1.5" />
    <rect x="0" y="0" width="410" height="50" rx="12" fill="#92400e" fill-opacity="0.4" />
    <text x="205" y="32" fill="#fde68a" font-size="16" font-weight="bold" text-anchor="middle">⚙️ ADMINISTRATOR</text>

    <!-- Step AD1 -->
    <rect x="25" y="70" width="360" height="75" rx="8" fill="url(#cardDarkGrad)" stroke="#fbbf24" stroke-width="1.2" />
    <text x="45" y="96" fill="#f1f5f9" font-size="14" font-weight="bold">1. User &amp; Access Control</text>
    <text x="45" y="118" fill="#94a3b8" font-size="11">Manage staff, roles &amp; permissions</text>

    <!-- Arrow AD1 -> AD2 -->
    <path d="M 205 145 L 205 210" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)" />

    <!-- Step AD2 -->
    <rect x="25" y="210" width="360" height="85" rx="8" fill="url(#cardDarkGrad)" stroke="#fbbf24" stroke-width="1.2" />
    <text x="45" y="236" fill="#f1f5f9" font-size="14" font-weight="bold">2. Clients &amp; MRF Approvals</text>
    <text x="45" y="258" fill="#94a3b8" font-size="11">Register client companies</text>
    <text x="45" y="276" fill="#94a3b8" font-size="11">Approve job requisitions (MRFs)</text>

    <!-- Arrow AD2 -> AD3 -->
    <path d="M 205 295 L 205 350" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)" />

    <!-- Step AD3 -->
    <rect x="25" y="350" width="360" height="85" rx="8" fill="url(#cardDarkGrad)" stroke="#fbbf24" stroke-width="1.2" />
    <text x="45" y="376" fill="#f1f5f9" font-size="14" font-weight="bold">3. AI &amp; Scoring Setup</text>
    <text x="45" y="398" fill="#fde68a" font-size="11">Configure score weights</text>
    <text x="45" y="416" fill="#94a3b8" font-size="11">Manage feature toggles</text>

    <!-- Arrow AD3 -> AD4 -->
    <path d="M 205 435 L 205 520" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)" />

    <!-- Step AD4 -->
    <rect x="25" y="520" width="360" height="80" rx="8" fill="url(#cardDarkGrad)" stroke="#fbbf24" stroke-width="1.2" />
    <text x="45" y="546" fill="#f1f5f9" font-size="14" font-weight="bold">4. Compliance &amp; Master Data</text>
    <text x="45" y="568" fill="#94a3b8" font-size="11">Set required documents</text>
    <text x="45" y="586" fill="#94a3b8" font-size="11">Manage skills dictionary</text>

    <!-- Arrow AD4 -> AD5 -->
    <path d="M 205 600 L 205 675" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)" />

    <!-- Step AD5 -->
    <rect x="25" y="675" width="360" height="75" rx="8" fill="url(#cardDarkGrad)" stroke="#fbbf24" stroke-width="1.2" />
    <text x="45" y="701" fill="#f1f5f9" font-size="14" font-weight="bold">5. Audit &amp; Security Logs</text>
    <text x="45" y="723" fill="#94a3b8" font-size="11">Review immutable system activity</text>

    <!-- Arrow AD5 -> AD6 -->
    <path d="M 205 750 L 205 830" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)" />

    <!-- Step AD6 -->
    <rect x="25" y="830" width="360" height="85" rx="8" fill="url(#cardDarkGrad)" stroke="#fbbf24" stroke-width="1.2" />
    <text x="45" y="856" fill="#f1f5f9" font-size="14" font-weight="bold">6. Analytics &amp; KPIs</text>
    <text x="45" y="878" fill="#94a3b8" font-size="11">Hiring speed &amp; funnel stats</text>
    <text x="45" y="896" fill="#94a3b8" font-size="11">TA performance tracking</text>

    <!-- Arrow AD6 -> AD7 -->
    <path d="M 205 915 L 205 985" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowAmber)" />

    <!-- Step AD7 -->
    <rect x="25" y="985" width="360" height="85" rx="10" fill="#78350f" stroke="#fbbf24" stroke-width="1.5" />
    <text x="45" y="1015" fill="#fef3c7" font-size="15" font-weight="bold">7. Reports &amp; Oversight</text>
    <text x="45" y="1038" fill="#fde68a" font-size="12">Export summary reports</text>
    <text x="45" y="1056" fill="#cbd5e1" font-size="11">Adjust platform policies</text>
  </g>

  <!-- CROSS-ROLE CONNECTOR ARROWS -->
  <path d="M 940 385 C 915 385, 915 245, 880 245" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowAmber)" />
  <path d="M 495 245 C 455 245, 455 425, 410 425" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowPurple)" />
  <path d="M 410 520 C 455 520, 455 520, 495 520" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowBlue)" />
  <path d="M 495 690 C 455 690, 455 690, 410 690" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowPurple)" />
  <path d="M 495 845 C 455 845, 455 845, 410 845" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowPurple)" />
  <path d="M 410 990 C 455 990, 455 990, 495 990" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowBlue)" />
  <path d="M 495 1150 C 455 1150, 455 1150, 410 1150" stroke="#34d399" stroke-width="2" marker-end="url(#arrowCross)" />

  <!-- FOOTER -->
  <text x="700" y="1265" fill="#64748b" font-size="12" text-anchor="middle">MEGS Recruitment Platform • Multi-Role Interaction Map</text>
</svg>
